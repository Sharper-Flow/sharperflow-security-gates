name: Self Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-package-manager:
    name: Warm Bun and Trivy executable caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Declare a Bun packageManager version
        run: |
          rm -f "$HOME/.bun/bin/bun"
          rm -rf "$HOME/.local/bin/trivy-bin"
          printf '%s\n' '{"packageManager":"bun@1.2.0"}' > package.json

      - name: Set up Bun without a version input
        id: bun
        uses: ./.github/actions/setup-bun-node
        with:
          install-mode: none

      - name: Assert the declared version
        env:
          BUN_VERSION: ${{ steps.bun.outputs.bun-version }}
        run: |
          test "$BUN_VERSION" = "1.2.0"
          test "$("$HOME/.bun/bin/bun" --version)" = "1.2.0"

      - name: Set up Trivy
        id: trivy
        uses: ./.github/actions/setup-trivy

      - name: Assert Trivy version
        env:
          TRIVY_VERSION: ${{ steps.trivy.outputs.version }}
        run: test "$TRIVY_VERSION" = "0.70.0"

  toolchain-cached-restore:
    name: Restore toolchains with release assets blocked
    needs: bun-package-manager
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NO_PROXY: "*"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Block GitHub release assets and verify both downloads fail
        run: |
          set -euo pipefail
          rm -f "$HOME/.bun/bin/bun"
          rm -rf "$HOME/.local/bin/trivy-bin"
          printf '%s\n' '{"packageManager":"bun@1.2.0"}' > package.json
          # Keep github.com and the Actions cache service reachable for setup.
          printf '%s\n' '127.0.0.1 release-assets.githubusercontent.com objects.githubusercontent.com get.trivy.dev' \
            '::1 release-assets.githubusercontent.com objects.githubusercontent.com get.trivy.dev' | sudo tee -a /etc/hosts > /dev/null
          for url in \
            https://github.com/oven-sh/bun/releases/download/bun-v1.2.0/bun-linux-x64.zip \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz; do
            location="$(curl --noproxy '*' -fsSI --max-time 15 "$url" | tr -d '\r' | python3 -c 'import sys; print(next((line.split(":", 1)[1].strip() for line in sys.stdin if line.lower().startswith("location:")), ""))')"
            [[ "$location" == https://release-assets.githubusercontent.com/* || "$location" == https://objects.githubusercontent.com/* ]]
            status=0
            curl --noproxy '*' -fsSL --max-time 15 -o /dev/null "$url" || status=$?
            test "$status" = 7
          done
          curl --noproxy '*' -fsS -H 'Accept: application/json' https://github.com/aquasecurity/trivy/releases/v0.70.0 | python3 -c 'import json,sys; assert json.load(sys.stdin)["tag_name"] == "v0.70.0"'
          status=0
          curl --noproxy '*' -fsSL --max-time 15 -o /dev/null 'https://get.trivy.dev/trivy?os=Linux&arch=64bit&version=0.70.0&type=tar.gz&client=setup-trivy' || status=$?
          test "$status" = 7

      - name: Restore Bun
        id: bun
        uses: ./.github/actions/setup-bun-node
        with:
          install-mode: none

      - name: Restore Trivy
        id: trivy
        uses: ./.github/actions/setup-trivy

      - name: Assert cached executable versions
        env:
          BUN_CACHE_HIT: ${{ steps.bun.outputs.cache-hit }}
          BUN_VERSION: ${{ steps.bun.outputs.bun-version }}
          TRIVY_CACHE_HIT: ${{ steps.trivy.outputs.cache-hit }}
          TRIVY_VERSION: ${{ steps.trivy.outputs.version }}
        run: |
          set -euo pipefail
          test "$BUN_CACHE_HIT" = true
          test "$BUN_VERSION" = 1.2.0
          test "$("$HOME/.bun/bin/bun" --version)" = 1.2.0
          test "$TRIVY_CACHE_HIT" = true
          test "$TRIVY_VERSION" = 0.70.0
          test "$("$HOME/.local/bin/trivy-bin/trivy" --version | python3 -c 'import sys; print(sys.stdin.read().splitlines()[0])')" = 'Version: 0.70.0'

      - name: Remove restored executables
        run: |
          rm -f "$HOME/.bun/bin/bun"
          rm -rf "$HOME/.local/bin/trivy-bin"

      - name: Force Bun cache miss
        id: bun-miss
        continue-on-error: true
        uses: ./.github/actions/setup-bun-node
        with:
          install-mode: none
          bun-no-cache: "true"

      - name: Force Trivy cache miss
        id: trivy-miss
        continue-on-error: true
        uses: ./.github/actions/setup-trivy
        with:
          cache: "false"

      - name: Assert both cold setups failed
        env:
          BUN_OUTCOME: ${{ steps.bun-miss.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy-miss.outcome }}
        run: |
          test "$BUN_OUTCOME" = failure
          test "$TRIVY_OUTCOME" = failure

  actionlint:
    name: Actionlint reusable workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Run actionlint
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.7

  docs-check:
    name: Basic docs/config checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Check required files
        run: |
          set -euo pipefail
          # Core docs/config
          test -f README.md
          test -f docs/ci-standard.md
          test -f docs/pokeedge-backend-pilot.md
          test -f .github/workflows/python-security-gate.yml
          test -f .github/workflows/javascript-security-gate.yml
          test -f .github/workflows/container-security-gate.yml
          test -f configs/python/bandit.yaml
          test -f configs/gitleaks/gitleaks.toml
          test -f configs/trivy/trivy.yaml
          # Standard building blocks
          test -f .github/actions/setup-python-uv/action.yml
          test -f .github/actions/setup-bun-node/action.yml
          test -f .github/actions/setup-trivy/action.yml
          test -f rulesets/sharperflow-app-protection.json
          test -f scripts/apply-ruleset.sh
          test -f scripts/resolve-scan-range.sh
          test -f scripts/gitleaks-scan.sh
          test -f scripts/test-gitleaks-scan.py

      - name: Validate ruleset JSON
        run: |
          set -euo pipefail
          python3 -c '
          import json, sys
          d = json.load(open("rulesets/sharperflow-app-protection.json"))
          assert d["target"] == "branch", "ruleset target must be branch"
          assert d["enforcement"] == "active", "ruleset must be active"
          assert d["bypass_actors"] == [], "bypass_actors must be empty (enforce for admins)"
          types = [r["type"] for r in d["rules"]]
          assert "required_status_checks" in types, "missing required_status_checks rule"
          rsc = next(r for r in d["rules"] if r["type"] == "required_status_checks")
          ctxs = [c["context"] for c in rsc["parameters"]["required_status_checks"]]
          assert ctxs == ["Sharperflow CI Gate"], f"required check must be the summary only, got {ctxs}"
          # strict require-branch-up-to-date is intentionally OFF: it caused the
          # PR merge-collision loop (rebase plus CI-rerun churn) on a small-seat org
          # with many concurrent agent/bot PRs. Serialization is via native
          # auto-merge plus squash; loose checks are caught by the next PR CI run.
          # See ci-standard.md section 6 Merge serialization.
          assert rsc["parameters"]["strict_required_status_checks_policy"] is False, "strict policy must be OFF (collision-loop fix)"
          # Squash-only is enforced SOLELY by allowed_merge_methods. non_fast_forward
          # only blocks force-pushes, NOT merge commits. squash-only excludes
          # merge-commit AND rebase, giving linear squash history.
          pr = next(r for r in d["rules"] if r["type"] == "pull_request")
          methods = pr["parameters"].get("allowed_merge_methods")
          assert methods == ["squash"], f"merge method must be squash-only, got {methods}"
          assert "non_fast_forward" in types, "non_fast_forward (force-push guard) required"
          print("ruleset JSON valid:", types, ctxs, "merge=squash-only strict=off")
          '

      - name: Validate Python uv setup guidance
        run: |
          set -euo pipefail
          python3 scripts/check-python-uv-guidance.py

  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Run shellcheck
        run: |
          set -euo pipefail
          shellcheck scripts/apply-ruleset.sh scripts/resolve-scan-range.sh scripts/gitleaks-scan.sh

  scan-mode-scripts:
    name: Scan-mode resolver and Gitleaks diff behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Build synthetic pull-request repository
        run: |
          set -euo pipefail
          repo="$(mktemp -d)/repo"
          git init -q -b main "${repo}"
          git -C "${repo}" config user.email test@example.com
          git -C "${repo}" config user.name test
          echo base > "${repo}/base.txt"
          git -C "${repo}" add .
          git -C "${repo}" commit -qm c1
          echo more > "${repo}/more.txt"
          git -C "${repo}" add .
          git -C "${repo}" commit -qm c2
          git -C "${repo}" checkout -qb feature
          # Fabricated fixture: assembled at runtime so this repo's own files
          # never contain a gitleaks-matchable token literal.
          pat="ghp_""R9aLq3XzV7mK2pT8wN4yB6cD1fH5jS0uE3gA"
          printf 'token = "%s"\n' "${pat}" > "${repo}/secret.txt"
          git -C "${repo}" add .
          git -C "${repo}" commit -qm secret
          git -C "${repo}" commit -qm empty --allow-empty
          git -C "${repo}" checkout -q main
          git -C "${repo}" merge -q --no-ff feature -m "pr merge"
          echo "REPO=${repo}" >> "${GITHUB_ENV}"

      - name: Assert scan-range resolver outputs
        run: |
          set -euo pipefail
          resolver="${PWD}/scripts/resolve-scan-range.sh"
          out="$(mktemp)"
          run_resolver() {
            # usage: run_resolver [ENV=VAL ...]; runs inside the synthetic repo
            (cd "${REPO}" && env GITHUB_OUTPUT="${out}" "$@" "${resolver}")
          }
          expect() {
            grep -qx "$1" "${out}" || { echo "missing output: $1"; exit 1; }
          }
          pr_base="$(git -C "${REPO}" rev-parse HEAD^1)"
          pr_head="$(git -C "${REPO}" rev-parse HEAD^2)"

          # pull_request + auto -> diff over the merge-ref parents
          run_resolver GITHUB_EVENT_NAME=pull_request SCAN_MODE=auto
          expect "mode=diff"
          expect "base=${pr_base}"
          expect "head=${pr_head}"

          # scan-mode=full forces a full scan
          run_resolver GITHUB_EVENT_NAME=pull_request SCAN_MODE=full
          expect "mode=full"

          # push has no PR diff -> full
          run_resolver GITHUB_EVENT_NAME=push SCAN_MODE=auto
          expect "mode=full"

          # merge_group -> diff from merge_group.base_sha
          event="$(mktemp)"
          printf '{"merge_group":{"base_sha":"%s"}}' "${pr_base}" > "${event}"
          run_resolver GITHUB_EVENT_NAME=merge_group SCAN_MODE=auto GITHUB_EVENT_PATH="${event}"
          expect "mode=diff"
          expect "base=${pr_base}"
          expect "head=$(git -C "${REPO}" rev-parse HEAD)"

          # merge_group whose base does not resolve -> full
          printf '{"merge_group":{"base_sha":"%s"}}' "0000000000000000000000000000000000000000" > "${event}"
          run_resolver GITHUB_EVENT_NAME=merge_group SCAN_MODE=auto GITHUB_EVENT_PATH="${event}"
          expect "mode=full"

          # an unknown scan-mode value is a caller error
          if run_resolver GITHUB_EVENT_NAME=push SCAN_MODE=bogus; then
            echo "unknown scan-mode must fail"
            exit 1
          fi

      - name: Gitleaks diff behavior and fail-closed paths
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.0
        run: |
          set -euo pipefail
          script="${PWD}/scripts/gitleaks-scan.sh"
          pr_base="$(git -C "${REPO}" rev-parse HEAD^1)"
          pr_head="$(git -C "${REPO}" rev-parse HEAD^2)"
          c1="$(git -C "${REPO}" rev-list --max-parents=0 HEAD)"
          cd "${REPO}"

          # a secret inside the range fails the gate (gitleaks exit 1)
          set +e
          MODE=diff BASE="${pr_base}" HEAD="${pr_head}" "${script}"
          status=$?
          set -e
          [[ ${status} -eq 1 ]] || { echo "expected exit 1 on a leak, got ${status}"; exit 1; }

          # a clean range passes
          set +e
          MODE=diff BASE="${c1}" HEAD="${pr_base}" "${script}"
          status=$?
          set -e
          [[ ${status} -eq 0 ]] || { echo "expected exit 0 on a clean range, got ${status}"; exit 1; }

          # an empty range fails closed instead of passing an empty scan
          set +e
          MODE=diff BASE="${pr_base}" HEAD="${pr_base}" "${script}"
          status=$?
          set -e
          [[ ${status} -ne 0 ]] || { echo "empty range must fail closed"; exit 1; }

          # full mode still fails on the leaked commit
          set +e
          MODE=full "${script}"
          status=$?
          set -e
          [[ ${status} -eq 1 ]] || { echo "expected exit 1 in full mode, got ${status}"; exit 1; }

          # an unavailable gitleaks binary fails closed (unparseable count)
          set +e
          MODE=diff BASE="${pr_base}" HEAD="${pr_head}" \
            GITLEAKS_IMAGE=example.invalid/gitleaks:nope "${script}"
          status=$?
          set -e
          [[ ${status} -ne 0 ]] || { echo "unavailable gitleaks must fail closed"; exit 1; }

      - name: Gitleaks wrapper regression harness
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.0
        run: |
          set -euo pipefail
          python3 scripts/test-gitleaks-scan.py -v
